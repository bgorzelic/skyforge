name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install ruff

      - name: Lint (ruff)
        run: ruff check .

      - name: Smoke import
        run: python -c "import skyforge; print(skyforge.__name__)"

      - name: CLI help
        run: skyforge --help
